, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#F2F7E8" text-anchor="start">主世界 · 村庄与草原</text><text x="1120" y="972" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" font-weight="400" fill="#A9B9A2" text-anchor="end">SURVIVAL / OVERWORLD</text><text x="360" y="1054" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="800" fill="#0C130D" text-anchor="start">二、四种玩法</text><line x1="360" y1="1068" x2="1140" y2="1068" stroke="#B7C2A6" stroke-width="1"/><rect x="360" y="1102" width="8" height="8" fill="#6EA832"/><text x="380" y="1112" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0C130D" text-anchor="start">生存模式：采集资源、合成工具、建造庇护所，并在夜晚对抗怪物。</text><text x="380" y="1132" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6D7A66" text-anchor="start"></text><rect x="360" y="1136" width="8" height="8" fill="#6EA832"/><text x="380" y="1146" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0C130D" text-anchor="start">创造模式：无限方块与飞行，适合建筑、红石与场景创作。</text><text x="380" y="1166" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6D7A66" text-anchor="start"></text><rect x="360" y="1170" width="8" height="8" fill="#6EA832"/><text x="380" y="1180" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0C130D" text-anchor="start">多人联机：局域网、服务器或联机工具，一起建造、冒险或对抗。</text><text x="380" y="1200" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6D7A66" text-anchor="start"></text><rect x="360" y="1204" width="8" height="8" fill="#6EA832"/><text x="380" y="1214" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0C130D" text-anchor="start">模组扩展：通过 MOD 与整合包，加入机械、魔法、任务与全新维度。</text><text x="380" y="1234" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6D7A66" text-anchor="start"></text><text x="360" y="1266" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="800" fill="#0C130D" text-anchor="start">三、为什么值得玩</text><line x1="360" y1="1280" x2="1140" y2="1280" stroke="#B7C2A6" stroke-width="1"/><text x="360" y="1308" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#6D7A66" text-anchor="start">它同时是一个游戏、一个创作工具和一个社交空间。你可以在单人世界里安静建造，也可以在服务器里和几十个人协作完成一</text><text x="360" y="1334" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#6D7A66" text-anchor="start">个项目；可以用原版规则，也可以装上百个模组把它变成另一款游戏。</text><rect x="360" y="1374" width="780" height="62" fill="#EAF3DB"/><rect x="360" y="1374" width="4" height="62" fill="#6EA832"/><text x="384" y="1412" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#4A781B" text-anchor="start">「先活过第一夜，再谈建筑与红石。」—— 新手路线第一课</text><text x="360" y="1480" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="800" fill="#0C130D" text-anchor="start">四、下一步</text><line x1="360" y1="1494" x2="1140" y2="1494" stroke="#B7C2A6" stroke-width="1"/><text x="360" y="1522" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#6D7A66" text-anchor="start">如果还没安装，先看「版本与玩法」确认设备与版本；如果已经装好，直接进入「新手入门教程」，按难度逐级跟做。</text><rect x="360" y="1562" width="780" height="54" fill="#E9ECDF"/><rect x="393" y="1580.5" width="1.5" height="1.5" fill="#4A781B"/><rect x="391.5" y="1582" width="3" height="1.5" fill="#4A781B"/><rect x="390" y="1583.5" width="3" height="1.5" fill="#4A781B"/><rect x="388.5" y="1585" width="3" height="1.5" fill="#4A781B"/><rect x="387" y="1586.5" width="3" height="1.5" fill="#4A781B"/><rect x="385.5" y="1588" width="3" height="1.5" fill="
