t x="360" y="462" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#2E2E33" text-anchor="start" letter-spacing="0">平台定位</text><line x1="360" y1="478" x2="1180" y2="478" stroke="#D9D9DF" stroke-width="1"/><text x="360" y="506" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">把「认识 → 获取 → 交流 → 学习」四件事收进一个站点。</text><text x="360" y="536" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">不做资源搬运的堆砌，而是让每个入口都有明确的下一步。</text><text x="360" y="622" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#2E2E33" text-anchor="start" letter-spacing="0">团队与协作</text><line x1="360" y1="638" x2="1180" y2="638" stroke="#D9D9DF" stroke-width="1"/><text x="360" y="666" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">内容组：维护版本、教程与常见问题。</text><text x="360" y="696" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">资源组：审核启动器、整合包与 MOD 的可用性与安全性。</text><text x="360" y="726" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">社区组：运营论坛、服务器与视频攻略。</text><text x="360" y="812" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#2E2E33" text-anchor="start" letter-spacing="0">内容原则</text><line x1="360" y1="828" x2="1180" y2="828" stroke="#D9D9DF" stroke-width="1"/><text x="360" y="856" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">所有下载页标注版本与兼容性。</text><text x="360" y="886" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">所有详情页保留面包屑与相关推荐。</text><text x="360" y="916" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">所有纠错都有反馈入口，2 个工作日内回复。</text><rect x="1220" y="432" width="340" height="300" fill="#FFFFFF" rx="8" stroke="#D9D9DF" stroke-width="1"/><text x="1240" y="470" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#2E2E33" text-anchor="start" letter-spacing="0">平台信息</text><text x="1240" y="510" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">上线时间</text><text x="1540" y="510" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#2E2E33" text-anchor="end" letter-spacing="0">2024-06</text><text x="1240" y="540" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">页面总量</text><text x="1540" y="540" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#2E2E33" text-anchor="end" letter-spacing="0">41</text><text x="1240" y="570" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">信息架构</text><text x="1540" y="570" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#2E2E33" text-anchor="end" letter-spacing="0">IA V1.0</text><text x="1240" y="600" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#8A8A93" text-anchor="start" letter-spacing="0">联系邮箱</text><text x="1540" y="600" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#2E2E33" text-anchor="end" letter-spacing="0">hi@mchub.example</text><text x="